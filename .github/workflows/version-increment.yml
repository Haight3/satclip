# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Version Increment

on:
  push:
    branches: ["main", "release-candidate"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set GIT Config
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git config --global user.name "$(gh api /users/${GITHUB_ACTOR} | jq .name -r)"
          git config -l
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest bumpver
          # if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Increase Version
        run: |
          CURRENT_BRANCH=$(echo "${GITHUB_REF##*/}")
          echo "Current branch: $CURRENT_BRANCH"

          if [ "$CURRENT_BRANCH" = "main" ]; then
            echo "Merge to main detected — bumping patch and tagging..."
            
            bumpver update --patch

          else
            echo "Regular push — bumping INC0 only"
            bumpver update --no-tag-commit
          fi
