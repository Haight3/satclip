[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "satclip"
version = "2026.3.0.2"
description = "SatCLIP - A Global, General-Purpose Geographic Location Encoder from Microsoft"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [
    { name = "Konstantin Klemmer", email = "konstantin.klemmer16@alumni.imperial.ac.uk" },
    { name = "Ismail Baris", email = "ismail.baris@haight.ai" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Utilities",
    "Private :: Do Not Upload",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/Haight3/satclip"
Documentation = "https://satclip.readthedocs.io/"
Changelog = "https://satclip.readthedocs.io/en/latest/changelog.html"
"Issue Tracker" = "https://github.com/Haight3/satclip/issues"

[project.scripts]
satclip = "satclip.__main__:cli_main"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.bumpver]
current_version = "2026.3.0.2"
version_pattern = "YYYY.MM.PATCH.INC0"
version_regex = "(?P<year>[0-9]{4})\\.(?P<month>[0-9]{1,2})\\.(?P<patch>[0-9]+)\\.(?P<inc>[0-9]+)"
version_replacement = "{year}.{month}.{patch}.{inc}"
commit_message = "ver(satclip): bump version from {old_version} -> {new_version}"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
"README.md" = [
    "{version}",
]
"src/satclip/__init__.py" = [
    "{version}",
]
"resources/docs/conf.py" = [
    "{version}",
]
"resources/docs/readme.rst" = [
    "{version}",
]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 110
profile = "black"


[tool.ruff.lint]
select = ["ALL"]

[tool.ruff]
line-length = 150
ignore = ["EM101", "TRY003", "T201", "D205", "D212", "PTH", "EM", "D400", "D415", "D401", "PLR0913", "D413", "ERA001", "RET504", "FBT003", "N812", "FBT001", "FBT002", "G004"]

